<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stopwatch-container">
        <h1>Stopwatch</h1>

        <div class="time-display" id="timeDisplay">
            00:00:00:000
        </div>

        <div class="shortcut-info">
            Space = Start/Pause | R = Reset | L = Lap
        </div>

        <div class="button-group">
            <button class="start-btn" onclick="startTimer()">Start</button>
            <button class="pause-btn" onclick="pauseTimer()">Pause</button>
            <button class="reset-btn" onclick="resetTimer()">Reset</button>
            <button class="lap-btn" onclick="recordLap()">Lap</button>
        </div>

        <div class="laps-section">
            <h2>Lap Times</h2>
            <ul class="lap-list" id="lapList"></ul>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
